<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      font-size: 18px;
      font-weight: 400;
      color: #fff;
      list-style: none;
      text-decoration: none;
      box-sizing: border-box;
      font-family: "微软雅黑";
      line-height: 60px;
    }
    body {
      background-image: url(./172ab17162f5acc11dc29105a58a8354.jpg);
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .yijihezi {
      width: 520px;
      height: 60px;
      margin: 40px auto 0;
    }
    .yijiliebiao {
      width: 520px;
      height: 60px;
    }
    .yijiliebiao > li {
      float: left;
      width: 120px;
      height: 60px;
      position: relative;
      display: flex;
      justify-content: center;
      margin-right: 50px;
    }
    .erjihezi {
      position: absolute;
      top: 60px;
      background-color: rgba(219, 143, 57, 0.562);
      padding: 0;
      height: 0;
      overflow: hidden;
      transition: all 300ms linear;
    }
    .erjihezi a {
      color: #000;
      font-size: 16px;
      line-height: 40px;
      justify-content: center;
    }
    .erjiliebiao li {
      width: 120px;
      height: 40px;
    }
    .yijiliebiao > li:hover .erjihezi {
      height: 140px;
      padding: 10px 0;
    }
    .yijiliebiao > li > a::after {
      content: '';
      position: absolute;
      left: 0;
      width: 120px;
      height: 0;
      background-color: #d64a0f;
      z-index: -1;
      transition: all 300ms linear;
    }
    .yijiliebiao > li:hover > a::after {
      height: 60px;
    }
  </style>
</head>
<body>
  <div class="yijihezi">
    <ul class="yijiliebiao">
      <li>
        <a href=" ">特色菜系</a >
        <div class="erjihezi">
          <ul class="erjiliebiao">
            <li><a href="#">川菜</a ></li>
            <li><a href="#">粤菜</a ></li>
            <li><a href="#">江浙菜</a ></li>
          </ul>
        </div>
      </li>
      <li>
        <a href="#">人气小吃</a >
        <div class="erjihezi">
          <ul class="erjiliebiao">
            <li><a href="#">街边美食</a ></li>
            <li><a href="#">甜品饮品</a ></li>
            <li><a href="#">烘焙点心</a ></li>
          </ul>
        </div>
      </li>
      <li>
        <a href="#">推荐店铺</a >
        <div class="erjihezi">
          <ul class="erjiliebiao">
            <li><a href="#">好评榜单</a ></li>
            <li><a href="#">新店打卡</a ></li>
            <li><a href="#">优惠活动</a ></li>
          </ul>
        </div>
      </li>
    </ul>
  </div>
</body>
</html>
